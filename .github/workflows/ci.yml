name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Lets publish.yml run the whole suite before releasing.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install ruff

      - run: ruff check .

      - name: Shell installer syntax
        run: sh -n install.sh && bash -n latex_forge/scripts_templates/setup.sh

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.14 is what uv picks when the VS Code extension or install.sh
        # installs latex-forge on a machine without Python.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # setuptools-scm needs tags to compute the version

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') }}
        run: pytest tests/ -v

      # Coverage gate on one combination (POSIX-only tests are skipped on Windows).
      - name: Run tests with coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: pytest tests/ -v --cov=latex_forge --cov-report=term-missing --cov-fail-under=85

  # The real thing: on a machine with no LaTeX, install latex-forge and the
  # light TinyTeX with the one-line installers users run, then compile every
  # built-in template, install a missing package on demand, and uninstall.
  integration:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      LATEX_FORGE_SPEC: ${{ github.workspace }}
      LATEX_FORGE_TEX: light
      LATEX_FORGE_INTEGRATION: "1"
      LATEX_FORGE_EXPECT_DISTRIBUTION: tinytex

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: sh install.sh

      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install.ps1

      - name: Put ~/.local/bin on PATH
        shell: bash
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Diagnose
        run: latex-forge diagnose

      - name: Create and build from the command line
        shell: bash
        run: |
          latex-forge create --name smoke --template research --output "$RUNNER_TEMP" --repo none
          latex-forge build "$RUNNER_TEMP/smoke"
          test -s "$RUNNER_TEMP/smoke/build/smoke.pdf"

      - name: Integration tests
        shell: bash
        run: ~/.local/bin/uv run --no-project --python 3.12 --with-editable . --with pytest pytest -m integration -v

      - name: Uninstall
        shell: bash
        run: |
          latex-forge setup --remove-tex
          if latex-forge diagnose; then echo "LaTeX is still reported after --remove-tex"; exit 1; fi
