name: Publish to PyPI

# Push a vX.Y.Z tag to release. Nothing is published unless the changelog
# documents the version and the whole CI suite — unit tests on every OS and
# Python version, and the real install-and-compile integration tests — passes
# on the tagged commit. After publishing, the release is installed from PyPI
# on each OS to make sure users actually get it.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: CHANGELOG.md documents this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi

  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [release-checks, ci]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # setuptools-scm needs tags to compute the version

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build package
        run: pip install build && python -m build

      - name: Built version matches the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls dist
          test -f "dist/latex_forge-$version.tar.gz" || { echo "::error::built version differs from $GITHUB_REF_NAME"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  verify:
    needs: publish
    uses: ./.github/workflows/verify-release.yml
    with:
      version: ${{ needs.publish.outputs.version }}
