[build-system]
requires = ["setuptools>=61", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-forge"
dynamic = ["version"]
description = "CLI for creating standalone LaTeX projects from this toolbox."
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "argcomplete>=3.0",
    "tomli>=1.1.0; python_version < '3.11'",
]
authors = [
    { name = "Thomas Gourmelen", email = "thomas.gourmelen@icloud.com" }
]
keywords = ["latex", "templates", "cli", "academic", "report", "research", "university"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/thmsgo18/latex-forge"
Repository = "https://github.com/thmsgo18/latex-forge"
"Bug Tracker" = "https://github.com/thmsgo18/latex-forge/issues"

[project.scripts]
latex-forge = "latex_forge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools_scm]
# Version is derived from the latest git tag (v*.*.*); no manual bump needed.

[tool.ruff.lint]
# Pinned explicitly so a new ruff release (whose default rule set can grow)
# never turns CI red on unchanged code: pyflakes + pycodestyle errors.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: needs a real TeX distribution; runs only with LATEX_FORGE_INTEGRATION=1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["latex_forge*"]

[tool.setuptools.package-data]
latex_forge = [
    "templates/**/*",
    "templates/**/.gitkeep",
    "styles/**/*",
    "assets/**/*",
    "agents_templates/**/*",
    "getting_started_templates/**/*",
    "scripts_templates/**/*",
    ".vscode/extensions.json",
    "tex_packages.json",
]
